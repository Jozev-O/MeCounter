mode: Mainline
next-version: 1.0.0
assembly-informational-format: '{Major}.{Minor}.{Patch}+{BranchName}.{ShortSha}'
branches:
  main:
    regex: ^main$
    increment: Patch
    tag: ''
    source-branches: ['feature', 'release', 'hotfix']
  feature:
    regex: ^feature(s)?[/-]
    increment: Minor
    tag: 'alpha'
    source-branches: []
  release:
    regex: ^release(s)?[/-]
    increment: Patch
    tag: 'rc'
    source-branches: ['feature']
  hotfix:
    regex: ^hotfix(es)?[/-]
    increment: Patch
    tag: 'hotfix'
    source-branches: ['main']
ignore:
  sha: []
commit-message-incrementing: Enabled